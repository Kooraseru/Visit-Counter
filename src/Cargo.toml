[package]
name = "github-visit-counter"
version = "0.1.0"
edition = "2024"
license = "ISC"
publish = false

[dependencies]
anyhow = "=1.0.99"
image = { version = "=0.25.6", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
reqwest = { version = "=0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"

[[bin]]
name = "github-visit-counter"
path = "rust/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
