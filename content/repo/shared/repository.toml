[sections.features.title.values]
en-US = "Features"
ja-JP = "機能"

[sections.features.body.values]
en-US = '''
- Uses GitHub's own repository Traffic API instead of third-party visitor tracking.
- Preserves daily view history without double-counting GitHub's overlapping traffic window.
- Generates a self-contained SVG from customizable digit artwork.
- Runs as a containerized Rust GitHub Action with no external counter server.
- Publishes generated history and counter output to an automation-owned branch.'''
ja-JP = '''
- サードパーティの訪問追跡ではなく、GitHub 自身のリポジトリ Traffic API を使用します。
- GitHub の重複するトラフィック期間を二重計上せず、日ごとの閲覧履歴を保持します。
- カスタマイズ可能な数字画像から自己完結型 SVG を生成します。
- 外部カウンターサーバーを使わず、コンテナ化された Rust GitHub Action として動作します。
- 生成された履歴とカウンターをオートメーション管理のブランチへ公開します。'''

[sections.quick_start.title.values]
en-US = "Quick Start"
ja-JP = "クイックスタート"

[sections.quick_start.body.values]
en-US = '''
1. Copy [`examples/update-visit-counter.yml`](../examples/update-visit-counter.yml) to `.github/workflows/update-visit-counter.yml` in the repository being counted.
2. Create a fine-grained token restricted to that repository with Administration read permission.
3. Store the token as the repository Actions secret `PERSONAL_RELEASE_TOKEN`.
4. Enable GitHub Pages for the repository and run the workflow once. Embed `https://OWNER.github.io/REPOSITORY/visit-counter/views.svg`. The workflow publishes `views.svg` and its GIF digit assets together, avoiding the restrictive `raw.githubusercontent.com` CSP.'''
ja-JP = '''
1. [`examples/update-visit-counter.yml`](../examples/update-visit-counter.yml) を、計測対象リポジトリの `.github/workflows/update-visit-counter.yml` にコピーします。
2. 対象リポジトリの Administration 読み取り権限を持つ fine-grained token を作成します。
3. トークンをリポジトリの Actions secret `PERSONAL_RELEASE_TOKEN` として保存します。
4. リポジトリで GitHub Pages を有効にして、ワークフローを一度実行します。`https://OWNER.github.io/REPOSITORY/visit-counter/views.svg` を埋め込んでください。ワークフローは `views.svg` と GIF の数字アセットを一緒に公開するため、`raw.githubusercontent.com` の厳しい CSP を回避できます。'''

